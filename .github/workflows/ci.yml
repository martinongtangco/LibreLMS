# CI — the constitution's gate stack, run mechanically (spec 053, ADR 0011).
#
# One job: MSSQL + Valkey as job-level service containers, then the exact
# command sequence the local development workflow uses:
#   restore -> build -> ArchitectureTests -> Host start (EF migrations +
#   seeders run at startup; readiness = HTTP 302) -> filler-clean -> the
#   five unit test projects -> Playwright.
#
# The MSSQL SA password below is a throwaway CI fixture (disposable
# service container, per-run database) — not a real credential.

name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiFixture!Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiFixture!Passw0rd' -C -Q 'SELECT 1' -b || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      ConnectionStrings__Sql: "Server=localhost,1433;Database=LearningLms;User Id=sa;Password=CiFixture!Passw0rd;TrustServerCertificate=True"
      ConnectionStrings__Valkey: "localhost:6379"
      ASPNETCORE_ENVIRONMENT: "Development"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore
        run: dotnet restore LibreLms.slnx

      - name: Build
        run: dotnet build LibreLms.slnx --no-restore

      - name: Architecture tests
        run: dotnet test tests/ArchitectureTests/ArchitectureTests.csproj --no-build

      - name: Start Host (runs EF migrations + seeders) and wait for readiness
        run: |
          dotnet run --project src/Host --urls http://localhost:5000 > /tmp/host.log 2>&1 &
          HOST_PID=$!
          code=""
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/ || true)
            [ "$code" = "302" ] && break
            kill -0 "$HOST_PID" 2>/dev/null || break
            sleep 2
          done
          if [ "$code" != "302" ]; then
            echo "::error::Host did not reach readiness (last HTTP code: ${code:-none})"
            tail -n 100 /tmp/host.log
            exit 1
          fi
          echo "Host ready (HTTP 302)"

      - name: Install sqlcmd (mssql-tools18)
        run: |
          if [ ! -x /opt/mssql-tools18/bin/sqlcmd ]; then
            # Runner-image drift (2026-11): newer ubuntu-latest images pre-install
            # packages-microsoft-prod, which already registers Microsoft's apt repo.
            # Try a plain install first; only older images need the config-package
            # download (try the image's own version, then 24.04 as fallback).
            if ! (sudo apt-get update -qq && sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18); then
              UBUNTU_VER=$(grep '^VERSION_ID=' /etc/os-release | cut -d= -f2)
              curl -fsSL -O "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VER}/packages-microsoft-prod.deb"                 || curl -fsSL -O "https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb"
              sudo DEBIAN_FRONTEND=noninteractive dpkg -i --force-confold packages-microsoft-prod.deb
              rm -f packages-microsoft-prod.deb
              sudo apt-get update
              sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
            fi
          fi

      - name: Unit tests — Catalog
        run: dotnet test tests/Catalog.Tests/Catalog.Tests.csproj --no-build

      - name: Unit tests — Enrollment
        run: dotnet test tests/Enrollment.Tests/Enrollment.Tests.csproj --no-build

      - name: Unit tests — Host
        run: dotnet test tests/Host.Tests/Host.Tests.csproj --no-build

      - name: Unit tests — Management
        run: dotnet test tests/Management.Tests/Management.Tests.csproj --no-build

      - name: Unit tests — Scorm
        run: dotnet test tests/Scorm.Tests/Scorm.Tests.csproj --no-build

      # Spec 053 run log (specs/HANDOFF-RUN-LOG.md): "unit suites write to the
      # shared LearningLms DB — the E2E filler-clean must run after the last
      # unit run." Must stay after the unit-test steps above, not before.
      # -d LearningLms: without it sqlcmd runs against master, where these tables
      # do not exist. -b: make any SQL error fail the step — without it sqlcmd
      # exits 0 and a no-op clean silently hands ~11.7k filler courses to the E2E
      # run, where the authenticated browse query then exceeds the 30s SQL
      # command timeout and every signed-in page 500s.
      - name: Filler-clean (removes Catalog perf-seed residue so E2E sees the seeded state)
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "CiFixture!Passw0rd" -C -W -b -d LearningLms -Q "
            SET QUOTED_IDENTIFIER ON; SET ANSI_NULLS ON;
            DELETE e FROM Enrollments e JOIN Courses c ON e.CourseId=c.Id WHERE c.Id NOT LIKE '11111111-%';
            DELETE ca FROM CourseAttempts ca JOIN Courses c ON ca.CourseId=c.Id WHERE c.Id NOT LIKE '11111111-%';
            DELETE sp FROM ScormPackages sp WHERE sp.CourseId NOT IN (SELECT Id FROM Courses WHERE Id LIKE '11111111-%');
            DELETE c FROM Courses c WHERE c.Id NOT LIKE '11111111-%';
            SELECT COUNT(*) AS RemainingCourses FROM Courses;
          "

      - name: Install Playwright test dependencies
        working-directory: tests/Playwright.Tests
        run: npm ci

      - name: Playwright browsers
        working-directory: tests/Playwright.Tests
        run: npx playwright install chromium --with-deps

      - name: E2E (Playwright)
        working-directory: tests/Playwright.Tests
        env:
          CI: "1"
        run: npx playwright test

  # Verification gate stack (constitution XVIII/XIX) - spec 059 spike, 2026-11-21.
  # Double-check on the PR diff; the primary enforcement is the local hook stages.
  # Gates (only when the PR touches tests/):
  #   1. Test integrity (XVIII.2): no test modification/deletion after the
  #      oracle/<N>-<feature> tag (new files in the Attack/ lane allowed).
  #   2. Mutation (XIX.2): Stryker --since on the PR base, diff scope, 80% floor
  #      with timeout-as-kill (user decision 2026-11-21). PASS-WITH-DOCUMENTED-
  #      EXCEPTION is the documented route: per-mutant vacuity evidence in the
  #      spec's mutation-report.md (CI enforces the floor; the exception is the
  #      maintainer-acknowledged path, never since.ignore-changes-in).
  # A gate that cannot fail is not evidence (XVII.2): tests touched with no
  # oracle/* tag fails loudly.
  verification-gates:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --since needs the base history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Set up local dotnet tools
        run: dotnet tool restore
      - name: Gate applicability + oracle tag check (XVII.2 / XVIII.2)
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          echo "base_sha=${BASE}" >> "$GITHUB_OUTPUT"
          if [ -n "$(git diff --name-only "${BASE}" HEAD -- tests/ 2>/dev/null)" ]; then
            echo "applies=true" >> "$GITHUB_OUTPUT"
            if [ -z "$(git tag -l 'oracle/*' | head -1)" ]; then
              echo "::error::PR touches tests/ but no oracle/* tag exists - the oracle stage (XVIII) has not run for this feature (XVII.2: a step that cannot fail is not evidence)."
              exit 1
            fi
          else
            echo "applies=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test integrity (XVIII.2)
        if: steps.scope.outputs.applies == 'true'
        run: bash scripts/check-test-integrity.sh
      - name: Mutation gate on the PR diff (XIX.2)
        if: steps.scope.outputs.applies == 'true' && github.event_name == 'pull_request'
        working-directory: tests/Management.Tests
        run: |
          # v1 scope: Management.Tests (the proven pilot configuration, spec 059).
          # Extension path: one step per test project with that module's
          # --test-case-filter (full-suite-per-mutant is too slow for CI on
          # large suites).
          # --break-on-initial-test-failure: a red baseline proves nothing.
          # since.ignore-changes-in is never set (XIX.2 shrunken-surface rule).
          dotnet stryker --since:${{ steps.scope.outputs.base_sha }}             --test-case-filter "FullyQualifiedName~TreeLayout|FullyQualifiedName~OrgChartLayout"             --break-on-initial-test-failure --skip-version-check > stryker-gates.log 2>&1 || true
          tail -n 20 stryker-gates.log
          K=$(grep -oP 'Killed:\s+\K\d+' stryker-gates.log | head -1)
          S=$(grep -oP 'Survived:\s+\K\d+' stryker-gates.log | head -1)
          T=$(grep -oP 'Timeout:\s+\K\d+' stryker-gates.log | head -1)
          if [ -z "$K" ] || [ -z "$S" ] || [ -z "$T" ]; then
            echo "::error::could not parse the Stryker summary (baseline red or tool failure) - gate fails loud."
            exit 1
          fi
          TOTAL=$((K + S + T))
          if [ "$TOTAL" -eq 0 ]; then
            echo "No diff-scope mutants (PR changes no code covered by this filter) - gate vacuously satisfied."
            exit 0
          fi
          # Floor: 80% with timeout-as-kill; raw numbers always reported.
          SCORE=$(python3 -c "print(f'{($K + $T) / $TOTAL * 100:.1f}')")
          echo "Mutation gate (diff scope): killed=${K} survived=${S} timeout=${T} score=${SCORE}% floor=80%"
          if python3 -c "exit(0 if ($K + $T) / $TOTAL >= 0.80 else 1)"; then
            echo "Mutation gate PASS."
          else
            echo "::error::diff-scope mutation score ${SCORE}% < 80% floor. Survivors need tests that kill them (XIX.2: survivors are closed by tests, never exclusions) or per-mutant vacuity evidence in the spec's mutation-report.md (PASS-WITH-DOCUMENTED-EXCEPTION route)."
            exit 1
          fi